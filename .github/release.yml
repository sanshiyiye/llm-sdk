changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: 新功能
      labels:
        - feature
        - enhancement
    - title: 修复
      labels:
        - fix
        - bug
    - title: 文档与运维
      labels:
        - docs
        - chore
        - ci
    - title: 其他变更
      labels:
        - "*"
template: |
  ## 版本摘要

  $CHANGES

  ## 发布产物

  - Python: `llm-sdk`
  - TypeScript: `@goat/llm-sdk`
  - Go: `github.com/goat/llm-sdk/sdk/go`

  ## 文档入口

  - 项目文档站点: https://goat.github.io/llm-sdk/
