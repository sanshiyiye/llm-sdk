name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e "sdk/python[dev]"
      - name: Run Python tests
        run: |
          pytest sdk/python/tests -q
          pytest sdk/compat-tests/test_python_sdk.py -q

  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Install TypeScript deps
        run: npm ci
      - name: Run TypeScript checks
        run: |
          npm run test
          npm run test:compat:types
          npm run test:compat
          npm run lint

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Run Go tests
        run: |
          cd sdk/go && go test ./...
          cd ../compat-tests && go test -v

  configmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check configmap is synced
        run: python scripts/generate_k8s_configmap.py --check
