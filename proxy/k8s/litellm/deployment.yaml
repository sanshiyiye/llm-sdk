apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-proxy
  namespace: llm-system
  labels:
    app: litellm-proxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: litellm-proxy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: litellm-proxy
    spec:
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4000
              name: http
            - containerPort: 9090
              name: metrics
          args:
            - "--config"
            - "/app/config/config.yaml"
            - "--port"
            - "4000"
          envFrom:
            - secretRef:
                name: litellm-secrets

          # startupProbe: 给冷启动最多 60s
          startupProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            failureThreshold: 6
            periodSeconds: 10

          # livenessProbe: 进程死锁时重启 Pod
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          # readinessProbe: 模型 API 不可达时从 Service 摘除
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 4000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2
            successThreshold: 1

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

          volumeMounts:
            - name: config-volume
              mountPath: /app/config
              readOnly: true

      volumes:
        - name: config-volume
          configMap:
            name: litellm-config

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: litellm-proxy
                topologyKey: kubernetes.io/hostname
