# =============================================================
# LiteLLM Proxy 模型配置
# 不含 secrets，可提交 git
# API Key 全部通过环境变量注入（os.environ/VAR_NAME）
# 开发/生产共用此文件；K8s ConfigMap 生产版 fallback 去掉 local-chat
# =============================================================

model_list:

  # ── 智能路由组（业务层首选）──────────────────────────────────

  - model_name: auto-chat
    litellm_params:
      model: openai/Pro/zai-org/GLM-4.7
      api_base: https://api.siliconflow.cn/v1
      api_key: os.environ/SILICONFLOW_API_KEY
    model_info:
      mode: chat
      tags: [chat, auto]

  - model_name: auto-vision
    litellm_params:
      model: openai/Pro/zai-org/GLM-4.5V
      api_base: https://api.siliconflow.cn/v1
      api_key: os.environ/SILICONFLOW_API_KEY
    model_info:
      mode: chat
      supports_vision: true
      tags: [vision, auto]

  # ── OpenAI ────────────────────────────────────────────────────

  - model_name: gpt-chat
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      mode: chat
      tags: [chat, openai]

  - model_name: gpt-vision
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      mode: chat
      supports_vision: true
      tags: [vision, openai]

  - model_name: text-embedding
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      mode: embedding
      tags: [embedding]

  - model_name: gpt-image-gen
    litellm_params:
      model: openai/dall-e-3
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      mode: image_generation
      tags: [image-gen]

  # ── Gemini ────────────────────────────────────────────────────

  - model_name: gemini-chat
    litellm_params:
      model: openai/Pro/zai-org/GLM-4.7
      api_base: https://api.siliconflow.cn/v1
      api_key: os.environ/SILICONFLOW_API_KEY
    model_info:
      mode: chat
      tags: [chat, fast, siliconflow]

  - model_name: gemini-vision
    litellm_params:
      model: openai/Pro/zai-org/GLM-4.5V
      api_base: https://api.siliconflow.cn/v1
      api_key: os.environ/SILICONFLOW_API_KEY
    model_info:
      mode: chat
      supports_vision: true
      supports_video: true
      tags: [vision, video-input, siliconflow]

  - model_name: gemini-image-gen
    litellm_params:
      model: gemini/nano-banana-2
      api_key: os.environ/GEMINI_API_KEY
    model_info:
      mode: image_generation
      tags: [image-gen, gemini]

  # ── SiliconFlow ───────────────────────────────────────────────────

  - model_name: siliconflow-chat
    litellm_params:
      model: openai/Pro/zai-org/GLM-4.7
      api_base: https://api.siliconflow.cn/v1
      api_key: os.environ/SILICONFLOW_API_KEY
    model_info:
      mode: chat
      tags: [chat, siliconflow]

  - model_name: siliconflow-vision
    litellm_params:
      model: openai/Pro/zai-org/GLM-4.5V
      api_base: https://api.siliconflow.cn/v1
      api_key: os.environ/SILICONFLOW_API_KEY
    model_info:
      mode: chat
      supports_vision: true
      tags: [vision, siliconflow]

  - model_name: siliconflow-reasoning
    litellm_params:
      model: openai/deepseek-ai/DeepSeek-R1
      api_base: https://api.siliconflow.cn/v1
      api_key: os.environ/SILICONFLOW_API_KEY
    model_info:
      mode: chat
      tags: [reasoning, siliconflow]

  - model_name: siliconflow-image-gen
    litellm_params:
      model: openai/Qwen/Qwen-Image
      api_base: https://api.siliconflow.cn/v1
      api_key: os.environ/SILICONFLOW_API_KEY
    model_info:
      mode: image_generation
      tags: [image-gen, siliconflow]

  # ── 本地模型（仅开发；生产 K8s ConfigMap 中 fallback 不引用此条）──

  - model_name: local-chat
    litellm_params:
      model: ollama/llama3.2
      base_url: http://localhost:11434
    model_info:
      mode: chat
      tags: [chat, local]

# ── 路由策略 ────────────────────────────────────────────────────

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 300  # 把路由超时从 30s 提高到 300s
  retry_after: 3
  fallbacks:
    - auto-chat:   [siliconflow-chat, gpt-chat, local-chat]
    - auto-vision: [siliconflow-vision, gpt-vision]
    - gemini-chat: [siliconflow-chat, gpt-chat]

# ── 全局设置 ────────────────────────────────────────────────────

general_settings:
  port: 4000
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  tpm_limit: 1000000
  request_timeout: 300  # 把全局超时从 60s 提高到 300s，适应 DeepSeek-R1 等慢思考模型
  default_fallbacks: [gpt-chat]

litellm_settings: {}
