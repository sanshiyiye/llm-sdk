[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-sdk"
version = "1.0.0"
description = "多语言 LLM 内部 SDK，通过 LiteLLM Proxy 统一调用各厂商模型"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["llm", "sdk", "litellm", "ai", "proxy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "openai>=1.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/goat/llm-sdk"
Repository = "https://github.com/goat/llm-sdk"
Documentation = "https://goat.github.io/llm-sdk/"
Issues = "https://github.com/goat/llm-sdk/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools]
packages = ["llm_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
